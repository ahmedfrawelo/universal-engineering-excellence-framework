name: Validate UEEF

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.16"
      - name: Framework validation
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-home'
          try {
            ./scripts/validate-framework.ps1
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            throw
          }
      - name: Installer integration tests
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-home'
          ./scripts/test-installers.ps1
      - name: Full assurance including runtime hardening
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-home'
          New-Item -ItemType Directory -Path $env:CODEX_HOME -Force | Out-Null
          try {
            ./scripts/measure-assurance.ps1 -Mode Full -Enforce
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            throw
          }

  unix:
    name: Unix validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.16"
      - name: Framework validation
        shell: bash
        run: ./scripts/validate-framework.sh
      - name: Unix assurance
        shell: bash
        run: ./scripts/ueef-audit.sh --quick
      - name: Unix 2.13 workflow tool tests
        shell: bash
        run: |
          sh ./scripts/test-intent-fidelity-contract.sh
          sh ./scripts/test-ueef-task-preflight.sh
          sh ./scripts/test-project-memory.sh
          sh ./scripts/test-evidence-export.sh
          sh ./scripts/test-diff-impact.sh
          sh ./scripts/test-task-budget-advice.sh
