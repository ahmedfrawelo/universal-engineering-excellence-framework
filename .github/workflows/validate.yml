name: Validate UEEF

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-workflow-engine:
    name: Spec workflow engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.16"
      - name: Install locked Spec workflow dependencies
        working-directory: engines/spec-workflow
        run: uv sync --group dev --extra upstream --locked
      - name: Lint UEEF-owned Spec workflow code
        working-directory: engines/spec-workflow
        run: uv run --frozen ruff check ueef tests
      - name: Type-check UEEF-owned Spec workflow code
        working-directory: engines/spec-workflow
        run: uv run --frozen pyright ueef/ueef_spec_workflow
      - name: Scan UEEF-owned Spec workflow code
        working-directory: engines/spec-workflow
        run: uv run --frozen bandit -q -r ueef/ueef_spec_workflow
      - name: Run Spec workflow engine tests
        working-directory: engines/spec-workflow
        run: uv run --frozen pytest
      - name: Validate the pinned upstream workflow through vendored code
        working-directory: engines/spec-workflow
        run: uv run --frozen python -m ueef_spec_workflow upstream-validate --workflow upstream/spec-kit/workflows/speckit/workflow.yml

  repository-engine:
    name: Repository engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.16"
      - name: Install locked engine development dependencies
        working-directory: engines/repository-intelligence
        run: uv sync --group dev --locked
      - name: Lint embedded repository engine
        working-directory: engines/repository-intelligence
        run: uv run --frozen ruff check .
      - name: Run embedded repository engine tests
        working-directory: engines/repository-intelligence
        run: uv run --frozen pytest

  windows:
    name: Windows validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.16"
      - name: Framework validation
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-home'
          try {
            ./scripts/validate-framework.ps1
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            throw
          }
      - name: Installer integration tests
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-home'
          ./scripts/test-installers.ps1
      - name: Full assurance including runtime hardening
        shell: pwsh
        timeout-minutes: 20
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-home'
          New-Item -ItemType Directory -Path $env:CODEX_HOME -Force | Out-Null
          try {
            $checks = [System.Collections.Generic.List[object]]::new()
            function Invoke-AssuranceCheck([string]$Name, [scriptblock]$Action) {
              Write-Host "Running assurance check: $Name"
              $watch = [Diagnostics.Stopwatch]::StartNew()
              & $Action
              $succeeded = $?
              if (!$succeeded) { throw "$Name failed." }
              $watch.Stop()
              $checks.Add([pscustomobject]@{
                name = $Name
                status = 'PASS'
                durationMs = [int]$watch.ElapsedMilliseconds
              })
              Write-Host "Assurance check passed: $Name ($($watch.ElapsedMilliseconds) ms)"
            }
            Invoke-AssuranceCheck 'framework-validation' { ./scripts/validate-framework.ps1 -SkipNestedTests }
            Invoke-AssuranceCheck 'script-syntax' { ./scripts/test-script-syntax.ps1 }
            Invoke-AssuranceCheck 'runtime-hardening' { ./scripts/test-runtime-hardening.ps1 -Fast -SkipUnixStatusChecks }
            $summaryPath = Join-Path $env:RUNNER_TEMP 'ueef-full-assurance-summary.json'
            [pscustomobject]@{
              schemaVersion = 1
              generatedAt = (Get-Date).ToUniversalTime().ToString('o')
              root = '<project-root>'
              mode = 'full'
              checks = @($checks)
              status = 'PASS'
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $summaryPath -Encoding utf8
            ./scripts/measure-assurance.ps1 -Mode Full -SummaryPath $summaryPath -Enforce
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            throw
          }

  unix:
    name: Unix validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.16"
      - name: Framework validation
        shell: bash
        run: ./scripts/validate-framework.sh
      - name: Unix assurance
        shell: bash
        run: ./scripts/ueef-audit.sh --quick
      - name: Unix 2.13 workflow tool tests
        shell: bash
        run: |
          sh ./scripts/test-intent-fidelity-contract.sh
          sh ./scripts/test-ueef-task-preflight.sh
          sh ./scripts/test-project-memory.sh
          sh ./scripts/test-evidence-export.sh
          sh ./scripts/test-diff-impact.sh
          sh ./scripts/test-task-budget-advice.sh
