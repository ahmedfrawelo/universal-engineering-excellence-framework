[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ueef-spec-workflow"
version = "0.1.0"
description = "UEEF task graph and dynamic execution scheduler with a provenance-tracked Spec Kit engine snapshot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
upstream = [
  "typer>=0.24.0",
  "click>=8.2.1",
  "rich",
  "platformdirs",
  "readchar",
  "pyyaml>=6.0",
  "packaging>=23.0",
  "pathspec>=0.12.0",
  "json5>=0.13.0",
]
test = ["pytest>=9.0"]

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "pyright>=1.1.409",
  "pytest>=9.0.3",
  "ruff>=0.15.13",
]

[project.scripts]
ueef-spec-workflow = "ueef_spec_workflow.cli:main"

[tool.setuptools]
package-dir = {"" = "ueef"}
packages = ["ueef_spec_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
